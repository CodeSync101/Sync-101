server:
  port: 8083

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: postgres
    password: "root"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/codesync-auth
          jwk-set-uri: http://localhost:8080/realms/codesync-auth/protocol/openid-connect/certs

eureka:
  client:
    enabled: false

keycloak:
  server-url: http://localhost:8080
  realm: codesync-auth
  client-id: CodeSync101
  admin-client:
    username: admin
    password: admin
    client-id: admin-cli
    grant-type: password
    realm: codesync-auth

github:
  api:
    url: https://api.github.com
    token:
#Add A github persone access token here

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    filter: true

logging:
  level:
    root: INFO
    org.springframework: DEBUG