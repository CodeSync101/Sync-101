server:
  port: 8082

spring:
  application:
    name: api-gateway
  main:
    allow-bean-definition-overriding: true
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        - id: web-api
          uri: http://localhost:8084
          predicates:
            - Path=/reporting/**
          filters:
            - StripPrefix=2

        - id: user-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/**
          filters:
            - StripPrefix=3

        - id: projetMission
          uri: http://localhost:8085
          predicates:
            - Path=/matiere/**
          filters:
            - StripPrefix=1

        - id: GestionRec_Not
          uri: http://localhost:8086
          predicates:
            - Path=/gestionrec/**
          filters:
            - StripPrefix=1

        - id: backend
          uri: http://localhost:8089
          predicates:
            - Path=/task/api/**
          filters:
            - StripPrefix=2

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedHeaders: "*"
            allowedMethods: "*"
            allowCredentials: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG
    com.example: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
